
name: Android Autonomous Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Validate and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Descargar repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Java 17
      - name: Configure Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configurar Python
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 4. Instalar Gradle
      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 5. Configurar Android SDK sin setup-android
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
            echo "Android command-line tools not found"
            exit 1
          fi

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "SDK Manager detected:"
          echo "$SDKMANAGER"

      # 6. Aceptar licencias
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

      # 7. Instalar SDK 36
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 8. Comprobar entorno
      - name: Verify Android Environment
        run: |
          java -version
          python --version
          gradle --version
          adb version

      # 9. Ejecutar reorganizador y auditor
      - name: Run automatic validator
        run: |
          if [ ! -f .github/scripts/validator.py ]; then
            echo "ERROR: validator.py is missing"
            exit 1
          fi

          python .github/scripts/validator.py

      # 10. Generar Gradle Wrapper
      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          if [ ! -f gradlew ] || \
             [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1
          fi

          chmod +x gradlew

      # 11. Compilar APK
      - name: Build Debug APK
        run: |
          ./gradlew clean assembleDebug --stacktrace

      # 12. Guardar APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
